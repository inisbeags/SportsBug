name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Configure release repository
        shell: python
        run: |
          import json, os
          from pathlib import Path
          Path('release.json').write_text(json.dumps({'repository': os.environ['GITHUB_REPOSITORY']}))
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean --windowed --name SportsBug --icon SportsBug.ico --add-data "SportsBug.ico:." --add-data "release.json:." sportsbug.py
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import ast; t=ast.parse(open('sportsbug.py', encoding='utf-8').read()); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='VERSION' for x in n.targets)))"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION in sportsbug.py' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SportsBug-Windows-installer
          path: installer-output/SportsBug-Setup.exe
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installer-output/SportsBug-Setup.exe --draft --title "SportsBug ${{ github.ref_name }}" --generate-notes
